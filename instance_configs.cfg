# Please note that the code below is modified by YANDEX LLC

[Accounts]
deprovision_remove = false
gpasswd_add_cmd = gpasswd -a {user} {group}
gpasswd_remove_cmd = gpasswd -d {user} {group}
groupadd_cmd = groupadd {group}
groups = adm,dip,docker,lxd,plugdev,video
useradd_cmd = useradd -m -s /bin/bash -p * {user}
userdel_cmd = userdel -r {user}

[Daemons]
accounts_daemon = true
clock_skew_daemon = true
network_daemon = true

[InstanceSetup]
host_key_types = ecdsa,ed25519,rsa
network_enabled = false
optimize_local_ssd = false
set_boto_config = false
set_host_keys = false
set_multiqueue = false

[IpForwarding]
ethernet_proto_id = 66
ip_aliases = false
target_instance_ips = false

[MetadataScripts]
default_shell = /bin/bash
run_dir = 
shutdown = true
startup = true

[NetworkInterfaces]
dhclient_script = /sbin/google-dhclient-script
dhcp_command = 
ip_forwarding = false
setup = false

[OSLogin]
cert_authentication = false
